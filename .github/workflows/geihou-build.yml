name: Geihou CI Build

on:
  push:
    branches:
      - master-jdk17
      - master
    paths:
      - pom-geihou.xml
      - 'geihou-*/**'
      - .github/workflows/geihou-build.yml
      - .github/workflows/geihou-bootstrap-flyway-smoke.yml
  pull_request:
    branches:
      - master-jdk17
      - master
    paths:
      - pom-geihou.xml
      - 'geihou-*/**'
      - .github/workflows/geihou-build.yml
      - .github/workflows/geihou-bootstrap-flyway-smoke.yml

jobs:
  geihou-compile-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile gate
        run: mvn -f pom-geihou.xml -B clean compile -Dmaven.test.skip=true

  geihou-bootstrap-smoke:
    needs: geihou-compile-gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: geihou_ci_root
          MYSQL_DATABASE: geihou_ci
          MYSQL_USER: geihou_ci
          MYSQL_PASSWORD: geihou_ci_pwd
        ports:
          - 13316:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pgeihou_ci_root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Geihou dependency BOM
        run: mvn -f geihou-dependencies/pom.xml -B -DskipTests install

      - name: Install bootstrap reactor dependencies
        run: mvn -f pom-geihou.xml -B -pl geihou-bootstrap -am -DskipTests install

      - name: Scheduling activation smoke test
        run: mvn -f geihou-bootstrap/pom.xml -B test -Dtest=SchedulingActivationSmokeTest -Dsurefire.useFile=false

      - name: Flyway migration smoke test
        run: mvn -f geihou-bootstrap/pom.xml -B test -Dtest=FlywayMigrationSmokeTest -Dsurefire.useFile=false

      - name: Geihou bootstrap non-web startup gate
        shell: bash
        run: |
          set -euo pipefail
          GEIHOU_DEV_DB_URL='jdbc:mysql://127.0.0.1:13316/geihou_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai' \
          GEIHOU_DEV_DB_USERNAME='geihou_ci' \
          GEIHOU_DEV_DB_PASSWORD='geihou_ci_pwd' \
            mvn -f geihou-bootstrap/pom.xml -B -DskipTests org.springframework.boot:spring-boot-maven-plugin:3.5.9:run \
              -Dspring-boot.run.profiles=dev 2>&1 | tee geihou-bootstrap-startup.log
          grep -q 'Successfully validated' geihou-bootstrap-startup.log
          grep -q 'Successfully applied' geihou-bootstrap-startup.log
          grep -q 'Started GeihouBootstrapApplication' geihou-bootstrap-startup.log

  geihou-finance-biz-tests:
    needs: geihou-compile-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Geihou dependency BOM
        run: mvn -f geihou-dependencies/pom.xml -B -DskipTests install

      - name: Install finance reactor dependencies
        run: mvn -f pom-geihou.xml -B -pl geihou-module-finance/geihou-module-finance-biz -am -DskipTests install

      - name: Finance biz tests
        run: mvn -f geihou-module-finance/geihou-module-finance-biz/pom.xml -B test -Dsurefire.useFile=false
