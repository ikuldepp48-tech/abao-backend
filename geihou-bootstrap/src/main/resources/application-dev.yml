spring:
  application:
    name: geihou-bootstrap

  main:
    web-application-type: none

  datasource:
    url: ${GEIHOU_DEV_DB_URL}
    username: ${GEIHOU_DEV_DB_USERNAME}
    password: ${GEIHOU_DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    table: flyway_schema_history

logging:
  level:
    root: INFO
    org.flywaydb: INFO
    com.geihou: INFO
